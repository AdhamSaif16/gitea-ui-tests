name: Gitea UI Tests

on:
  push:
    paths:
      - 'tests/**'
      - '.github/workflows/ui-tests.yml'
      - 'requirements.txt'
      - '.env'
  pull_request:
    paths:
      - 'tests/**'

jobs:
  ui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # ✅ Install Google Chrome on the runner
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run UI tests (headless)
        env:
          BASE_URL: http://34.250.0.69:3000
          HEADLESS: "1"           # <- your tests check for "1"
          # GITEA_USERNAME: uitester
          # GITEA_PASSWORD: TestPass123!
          # GITEA_API_TOKEN: ${{ secrets.GITEA_API_TOKEN }}
        run: |
          chrome --version
          pytest tests -v
